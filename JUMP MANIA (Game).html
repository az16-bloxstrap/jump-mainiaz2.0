<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JUMP MANIA - VORTEX EDITION</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d17; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; image-rendering: pixelated; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; pointer-events: none; width: 100%; z-index: 10; }
        .menu { display: inline-block; background: rgba(0, 0, 0, 0.95); padding: 40px; border: 8px solid #55a630; pointer-events: auto; }
        h1 { font-size: 80px; margin: 0; color: #ffca3a; text-shadow: 6px 6px #c9184a; }
        .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .color-btn { width: 60px; height: 60px; border: 4px solid white; cursor: pointer; }
        .selected { border-color: #ffca3a; transform: scale(1.1); box-shadow: 0 0 15px #ffca3a; }
        button.start-btn { background: #55a630; border: none; color: white; padding: 20px 40px; font-size: 28px; cursor: pointer; font-family: inherit; font-weight: bold; margin-top: 20px; }
        button.start-btn:hover { background: #ffca3a; color: #000; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="ui">
    <div id="main-menu" class="menu">
        <h1>JUMP MANIA</h1>
        <button class="start-btn" onclick="showColorSelect()">CHOOSE COLORS</button>
    </div>
    <div id="color-select" class="menu hidden">
        <div style="display:flex; gap: 40px;">
            <div><div>PLAYER 1</div><div id="p1-colors" class="color-grid"></div></div>
            <div><div>PLAYER 2</div><div id="p2-colors" class="color-grid"></div></div>
        </div>
        <button class="start-btn" onclick="startBattle()">START BATTLE</button>
    </div>
    <div id="win-screen" class="menu hidden">
        <h1 id="win-txt">PLAYER 1 WINS!</h1>
        <button class="start-btn" onclick="location.reload()">REMATCH</button>
    </div>
</div>

<canvas id="game"></canvas>

<script>
let audioCtx, musicInterval;
const colors = ['#4caf50', '#f44336', '#2196f3', '#9c27b0', '#ffeb3b', '#ff9800'];
let p1Color = colors[2], p2Color = colors[1];

function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playNote(freq, type, duration, vol) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function startMusic() {
    let step = 0;
    musicInterval = setInterval(() => {
        if(gameState !== 'PLAYING') return;
        let bass = vortex.active ? 60 : [110, 110, 130, 146][step % 4];
        playNote(bass, 'triangle', 0.2, 0.08);
        step++;
    }, 200);
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let gameState = 'MENU';
const winLimit = 4, zoom = 0.82, keys = {};
let powerup = { x: 0, y: 0, active: false };
let vortex = { x: 0, y: 0, active: false, timer: 0, target: null, angle: 0 };

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

function showColorSelect() {
    initAudio();
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('color-select').classList.remove('hidden');
    setupColorGrid('p1-colors', 1); setupColorGrid('p2-colors', 2);
}

function setupColorGrid(id, pNum) {
    const grid = document.getElementById(id); grid.innerHTML = '';
    colors.forEach(c => {
        const btn = document.createElement('div'); btn.className = 'color-btn'; btn.style.background = c;
        if((pNum === 1 && p1Color === c) || (pNum === 2 && p2Color === c)) btn.classList.add('selected');
        btn.onclick = () => { if(pNum === 1) p1Color = c; else p2Color = c; setupColorGrid(id, pNum); playNote(440, 'sine', 0.1, 0.05); };
        grid.appendChild(btn);
    });
}

class Player {
    constructor(x, y, controls, pNum) {
        this.startPos = {x, y}; this.w = 120; this.h = 70; this.controls = controls; this.pNum = pNum;
        this.trail = []; this.rotation = 0; this.reset();
    }
    reset() {
        this.x = this.startPos.x; this.y = this.startPos.y;
        this.dx = 0; this.dy = 0; this.isJumping = false; this.canStomp = true; this.dashCD = 0;
        this.face = this.pNum === 1 ? 1 : -1; this.speedBoost = 0; this.rotation = 0;
    }
    update(other) {
        if (vortex.active && vortex.target === this) {
            let dx = (vortex.x - (this.x + this.w / 2)) * 0.05;
            let dy = (vortex.y - (this.y + this.h / 2)) * 0.05;
            this.x += dx; this.y += dy;
            this.rotation += 0.5; // Fast spin
            this.isJumping = true;
            return; 
        }

        this.rotation = 0;
        let currentSpeed = 8 + (this.speedBoost > 0 ? 6 : 0);
        if(keys[this.controls.dash] && this.dashCD <= 0) { this.dx = this.face * 45; this.dashCD = 50; playNote(800, 'square', 0.1, 0.1); }
        if(this.dashCD > 0) this.dashCD--;
        if(keys[this.controls.left]) { this.dx = -currentSpeed; this.face = -1; }
        else if(keys[this.controls.right]) { this.dx = currentSpeed; this.face = 1; }
        else this.dx *= 0.85;

        if(keys[this.controls.up] && !this.isJumping) { this.dy = -10; this.isJumping = true; playNote(300, 'triangle', 0.1, 0.1); }
        if(keys[this.controls.up] && this.dy < 0) this.dy -= 0.45;
        if(keys[this.controls.down] && this.isJumping && this.canStomp) { this.dy = 30; this.canStomp = false; playNote(100, 'sawtooth', 0.3, 0.1); }

        this.dy += 0.4; this.y += this.dy; this.x += this.dx;

        if (this.speedBoost > 0) {
            this.speedBoost--;
            this.trail.push({x: this.x, y: this.y, alpha: 0.5});
            if(this.trail.length > 8) this.trail.shift();
        } else { this.trail = []; }

        if (this.y < 0) { this.y = 0; this.dy = 1; }
        if (this.x < 0) this.x = 0;
        if (this.x > (canvas.width / zoom) - this.w) this.x = (canvas.width / zoom) - this.w;

        platforms.forEach(p => {
            if(this.x + this.w > p.x && this.x < p.x + p.w) {
                if(this.dy > 0 && this.y + this.h > p.y && this.y < p.y + 20) { this.y = p.y - this.h; this.dy = 0; this.isJumping = false; }
                if(this.dy < 0 && this.y < p.y + p.h && this.y > p.y + p.h - 20) { this.y = p.y + p.h; this.dy = 0; }
            }
        });
        if(this.x < other.x + other.w && this.x + this.w > other.x && Math.abs(this.y - other.y) < 40) {
            if(this.x < other.x) this.x = other.x - this.w; else this.x = other.x + other.w;
        }
    }
    draw() {
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        ctx.rotate(this.rotation);
        
        this.trail.forEach((t, i) => {
            ctx.globalAlpha = i / 15; ctx.fillStyle = this.pNum === 1 ? p1Color : p2Color;
            ctx.fillRect(-this.w/2 - (this.x - t.x), -this.h/2 - (this.y - t.y), this.w, this.h);
        });
        
        ctx.globalAlpha = 1; ctx.fillStyle = this.pNum === 1 ? p1Color : p2Color;
        ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
        ctx.strokeStyle = 'black'; ctx.lineWidth = 5; ctx.strokeRect(-this.w / 2, -this.h / 2, this.w, this.h);
        
        if(this.canStomp && !vortex.active) { ctx.fillStyle = 'yellow'; ctx.fillRect(-15, -this.h/2 - 15, 30, 10); }
        ctx.fillStyle = 'white'; let ex = this.face === 1 ? 20 : -45; ctx.fillRect(ex, -20, 25, 25);
        ctx.restore();
    }
}

const p1 = new Player(150, 400, {up:'KeyW', left:'KeyA', right:'KeyD', down:'KeyS', dash:'ShiftLeft'}, 1);
const p2 = new Player(1200, 400, {up:'ArrowUp', left:'ArrowLeft', right:'ArrowRight', down:'ArrowDown', dash:'Enter'}, 2);
p1.score = 0; p2.score = 0;
let platforms = [];

function startBattle() {
    document.getElementById('color-select').classList.add('hidden');
    document.getElementById('ui').classList.add('hidden');
    platforms = [
        { x: 0, y: (canvas.height / zoom) - 100, w: canvas.width / zoom, h: 100 },
        { x: 150, y: (canvas.height / zoom) * 0.5, w: 300, h: 40 },
        { x: (canvas.width / zoom) - 450, y: (canvas.height / zoom) * 0.5, w: 300, h: 40 }
    ];
    gameState = 'PLAYING'; startMusic();
    spawnOrb(); triggerVortex();
}

function spawnOrb() { if(gameState !== 'PLAYING') return; powerup = { x: (canvas.width / zoom) / 2 - 25, y: (canvas.height / zoom) * 0.3, active: true }; setTimeout(spawnOrb, 15000); }

function triggerVortex() {
    if(gameState !== 'PLAYING') return;
    vortex.active = true; vortex.x = (canvas.width/zoom)/2; vortex.y = (canvas.height/zoom)*0.4;
    vortex.target = Math.random() > 0.5 ? p1 : p2;
    playNote(50, 'sine', 2, 0.2);
    setTimeout(() => { vortex.active = false; vortex.target = null; }, 3500);
    setTimeout(triggerVortex, 18000 + Math.random()*5000);
}

function loop() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.scale(zoom, zoom);
    if(gameState === 'PLAYING') {
        p1.update(p2); p2.update(p1);
        if(vortex.active) {
            vortex.angle += 0.2;
            ctx.strokeStyle = '#9c27b0'; ctx.lineWidth = 10; ctx.beginPath();
            ctx.arc(vortex.x, vortex.y, 60 + Math.sin(Date.now()/50)*10, vortex.angle, vortex.angle + Math.PI*1.5); ctx.stroke();
        }
        if(powerup.active) {
            ctx.fillStyle = '#fffa00'; ctx.beginPath(); ctx.arc(powerup.x+25, powerup.y+25, 25 + Math.sin(Date.now()/100)*5, 0, Math.PI*2); ctx.fill();
            [p1, p2].forEach(p => { if(p.x < powerup.x + 50 && p.x + p.w > powerup.x && p.y < powerup.y + 50 && p.y + p.h > powerup.y) { powerup.active = false; p.speedBoost = 400; playNote(1000, 'sine', 0.5, 0.1); } });
        }
        [ [p1, p2], [p2, p1] ].forEach(([atk, vic]) => {
            if(atk.dy > 0 && atk.y + atk.h > vic.y && atk.y < vic.y && atk.x + atk.w > vic.x && atk.x < vic.x + vic.w) {
                atk.score++; playNote(600, 'square', 0.3, 0.1);
                if(atk.score >= winLimit) { gameState = 'WIN'; document.getElementById('ui').classList.remove('hidden'); document.getElementById('win-screen').classList.remove('hidden'); document.getElementById('win-txt').innerText = `PLAYER ${atk.pNum} WINS!`; }
                else { p1.reset(); p2.reset(); powerup.active = false; vortex.active = false; }
            }
        });
    }
    platforms.forEach(p => { ctx.fillStyle = '#5d4037'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = '#4caf50'; ctx.fillRect(p.x, p.y, p.w, 15); });
    p1.draw(); p2.draw();
    for(let i=0; i<winLimit; i++) {
        ctx.fillStyle = i < p1.score ? p1Color : 'rgba(0,0,0,0.2)'; ctx.fillRect(((canvas.width/zoom)/2)-180+i*40, 40, 30, 30);
        ctx.fillStyle = i < p2.score ? p2Color : 'rgba(0,0,0,0.2)'; ctx.fillRect(((canvas.width/zoom)/2)+60+i*40, 40, 30, 30);
    }
    requestAnimationFrame(loop);
}
window.onkeydown = e => keys[e.code] = true; window.onkeyup = e => keys[e.code] = false; loop();
</script>
</body>
</html>
